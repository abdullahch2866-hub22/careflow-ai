name: Apply workspace resume fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-workspace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Patch workspace resume behavior
        run: python .github/scripts/patch_workspace_resume.py

      - name: Install test dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Commit workspace resume fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No workspace changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Preserve workspace state across tab changes"
          git push
