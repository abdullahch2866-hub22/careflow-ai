name: Apply secure staff management

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-staff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply secure staff patch
        run: node tools/apply-secure-staff-management.mjs
      - name: Install test dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
      - name: Commit secure staff management
        run: |
          if git diff --quiet -- index.html; then
            echo "No secure staff changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add secure staff management"
          git push
