name: Apply sidebar navigation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-sidebar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Apply sidebar patch
        run: node tools/apply-sidebar-navigation.mjs

      - name: Install test dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Commit sidebar functions
        run: |
          if git diff --quiet -- index.html; then
            echo "No sidebar changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make workspace sidebar functional"
          git push
