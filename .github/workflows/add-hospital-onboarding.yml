name: Add hospital onboarding

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply onboarding patch
        run: python .github/scripts/add_hospital_onboarding.py
      - name: Run tests
        run: npm ci && npm test
      - name: Commit CareFlow update
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add automated hospital onboarding"
          git push
