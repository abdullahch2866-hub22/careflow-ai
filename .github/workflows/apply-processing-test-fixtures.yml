name: Apply processing reliability test fixtures

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch_processing_tests.py"
      - ".github/workflows/apply-processing-test-fixtures.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch test fixtures
        run: python scripts/patch_processing_tests.py
      - name: Commit patched tests
        run: |
          if git diff --quiet; then
            echo "No test fixture changes were needed."
            exit 0
          fi
          git config user.name "CareFlow Automation"
          git config user.email "actions@users.noreply.github.com"
          git add tests/cases.test.mjs tests/mock-supabase.js tests/processor-access.test.mjs
          git commit -m "Update tests for processing reliability"
          git push
