      - name: Verify inline JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(m => m[1]).filter(Boolean);
          if (!scripts.length) throw new Error('No inline script found');
          new Function(scripts.at(-1));
          for (const required of ['forgotPasswordBtn','passwordSetupForm','PASSWORD_RECOVERY','careflow_password_set','signOutBtn']) {
            if (!html.includes(required)) throw new Error('Missing auth feature: ' + required);
          }
          console.log('Password-flow syntax and feature markers verified.');
          NODE

      - name: Install test dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Commit password flow
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No password-flow changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add staff password and recovery flow"
          git push
