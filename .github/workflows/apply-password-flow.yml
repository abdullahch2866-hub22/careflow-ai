'''function setPasswordPanelVisible(visible, mode = "setup") {
  const panel = document.getElementById("passwordPanel");
  passwordFlowMode = visible ? mode : null;
  panel.hidden = !visible;
  if (!visible) return;
  document.getElementById("loginPanel").style.display = "none";
  document.querySelector(".header").style.display = "none";
  document.querySelector(".layout").style.display = "none";
  document.getElementById("passwordPanelTitle").textContent = mode === "recovery" ? "Set a new password" : "Finish your CareFlow account";
  document.getElementById("passwordPanelHelp").textContent = mode === "recovery"
    ? "Choose a new password for your CareFlow hospital account."
    : "Your invitation is accepted. Choose your own password before opening the hospital workspace.";
  document.getElementById("passwordStatus").textContent = "Use at least 12 characters and do not reuse a password from another account.";
  document.getElementById("newPassword").value = "";
  document.getElementById("confirmNewPassword").value = "";
  setTimeout(function() { document.getElementById("newPassword").focus(); }, 0);
}

async function requestPasswordReset() {
  const emailInput = document.getElementById("loginEmail");
  const status = document.getElementById("loginStatus");
  const button = document.getElementById("forgotPasswordBtn");
  const email = emailInput.value.trim();
  if (!email || !emailInput.checkValidity()) {
    status.textContent = "Enter a valid email address above first.";
    emailInput.focus();
    return;
  }
  button.disabled = true;
  status.textContent = "Sending password reset email...";
  try {
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: CAREFLOW_APP_URL });
    if (error) throw error;
    status.textContent = "If this email belongs to a CareFlow account, a password reset link has been sent. Open the newest email once.";
  } catch (error) {
    status.textContent = "Could not send the reset email. " + (error.message || "Please try again.");
  } finally {
    button.disabled = false;
  }
}

async function saveNewPassword(event) {
  event.preventDefault();
  const password = document.getElementById("newPassword").value;
  const confirmation = document.getElementById("confirmNewPassword").value;
  const status = document.getElementById("passwordStatus");
  const button = document.getElementById("savePasswordBtn");
  if (password.length < 12) {
    status.textContent = "Use at least 12 characters.";
    return;
  }
  if (password !== confirmation) {
    status.textContent = "The two passwords do not match.";
    return;
  }
  button.disabled = true;
  status.textContent = "Saving your password...";
  try {
    const { error } = await supabaseClient.auth.updateUser({
      password,
      data: { careflow_password_set: true }
    });
    if (error) throw error;
    recoveryFlowRequested = false;
    history.replaceState({}, document.title, CAREFLOW_APP_URL);
    status.textContent = "Password saved successfully ✓";
    document.getElementById("newPassword").value = "";
    document.getElementById("confirmNewPassword").value = "";
    setPasswordPanelVisible(false);
    await updateAuthUI();
  } catch (error) {
    status.textContent = "Could not save the password. " + (error.message || "Please request a new reset link and try again.");
  } finally {
    button.disabled = false;
  }
}

async function leavePasswordFlow() {
  recoveryFlowRequested = false;
  history.replaceState({}, document.title, CAREFLOW_APP_URL);
  await supabaseClient.auth.signOut();
  setPasswordPanelVisible(false);
  document.getElementById("loginPanel").style.display = "block";
  document.getElementById("loginStatus").textContent = "Sign in or request a new password link.";
}

