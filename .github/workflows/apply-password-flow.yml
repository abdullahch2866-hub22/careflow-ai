name: Apply CareFlow password flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-password-flow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Patch CareFlow authentication UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
'''  <div id="loginPanel" style="background:white; padding:25px; margin:25px; border:1px solid #e5e7eb; border-radius:12px;">
