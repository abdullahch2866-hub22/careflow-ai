name: Apply organization and users

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-settings:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply settings patch
        run: node tools/apply-organization-users.mjs
      - name: Install test dependencies
        run: npm ci
      - name: Run test suite
        run: npm test
      - name: Commit settings functions
        run: |
          if git diff --quiet -- index.html; then
            echo "No settings changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make organization and users functional"
          git push
