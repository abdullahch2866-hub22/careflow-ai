name: Apply processing reliability patch

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch_processing_reliability.py"
      - ".github/workflows/apply-processing-reliability.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CareFlow frontend
        run: python scripts/patch_processing_reliability.py
      - name: Verify reliability markers
        run: |
          grep -q 'processing_status' index.html
          grep -q 'Retry Processing' index.html
          grep -q 'invokeDocumentProcessing' index.html
      - name: Commit patched frontend
        run: |
          if git diff --quiet -- index.html; then
            echo "No frontend changes were needed."
            exit 0
          fi
          git config user.name "CareFlow Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add processing reliability and recovery UI"
          git push
